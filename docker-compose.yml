services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: pavilion
      POSTGRES_USER: pavilion
      POSTGRES_PASSWORD: change-this-db-password
    volumes:
      - pavilion_db:/var/lib/postgresql/data
  app:
    build: .
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://pavilion:change-this-db-password@db:5432/pavilion
      APP_ORIGIN: http://localhost:3000
      PORT: 3000
      BOOTSTRAP_ADMIN_EMAIL: admin@example.com
      BOOTSTRAP_ADMIN_PASSWORD: change-this-admin-password
volumes:
  pavilion_db:
